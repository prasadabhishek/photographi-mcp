name: 🐛 Bug Report
description: File a report to help us improve photographi
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Bug description
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Claude Desktop
        2. Run 'photographi_analyze_photo' on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please provide output from `tail -f ~/Library/Logs/Claude/mcp*.log`
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: photographi-mcp version
      description: Run `photographi --version` or check pyproject.toml
      placeholder: 0.1.0
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Check-off
      options:
        - label: I have verified that this is not a path issue (absolute paths are used).
          required: true
        - label: I have checked existing issues for duplicates.
          required: true
